[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt_vlm"
version = "0.1.0"
description = "Code d'entrainement du VLM de lecture de tickets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Price Tracker" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["receipt_vlm*"]

[tool.pytest.ini_options]
pythonpath = [".", "../src"]
addopts = "-ra"
