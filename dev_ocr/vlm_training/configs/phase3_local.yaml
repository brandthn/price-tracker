# Phase 3 en local, avec du synthetique bien abime pour se rapprocher des vraies
# photos.
phase: 3
lr: 5.0e-5
epochs: 3
trainable: [projector, lora_]
sources: [synthetic, real]
max_gen_samples: 16
log_every: 50

model:
  gradient_checkpointing: true

data:
  synthetic_on_the_fly: true
  synthetic_count: 800
  synthetic_diverse: true
  synthetic_distort: true
  synthetic_distort_intensity: heavy
  synthetic_val_fraction: 0.05
