[project]
name = "pricetracker-receipt-pipeline"
version = "0.1.0"
description = "PriceTracker — pipeline OCR tickets (parser + orchestration VLM, copie figée de dev_ocr) + runtime worker partagé (auth/gcs/pubsub/pg/mapper/weights)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PriceTracker" }]

dependencies = [
    "Pillow>=10.0",
    "fastapi>=0.111",
    "google-auth>=2.36.0",
    "google-cloud-storage>=2.16",
    "asyncpg>=0.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricetracker_receipt_pipeline"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
