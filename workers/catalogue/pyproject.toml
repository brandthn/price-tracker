[project]
name = "pricetracker-catalogue"
version = "0.1.0"
description = "Worker catalogue — matching tickets Open Prices via Gemini vision"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-cloud-storage>=2.16",
    "google-cloud-secret-manager>=2.20",
    "vertexai>=1.49",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.scripts]
pricetracker-catalogue = "pricetracker_catalogue.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricetracker_catalogue"]
