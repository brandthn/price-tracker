# Build config Cloud Build pour worker-ocr-vlm-groq (backend VLM Groq).
# Soumettre depuis la RACINE du monorepo (libs/ est dans le contexte) :
#   gcloud builds submit . --config=workers/ocr-vlm-groq/cloudbuild.yaml \
#     --substitutions=_SHORT_SHA=$(git rev-parse --short HEAD) \
#     --project=price-tracker-prod-01
#
# Puis bumper worker_ocr_vlm_groq_image_tag dans infra/envs/prod/variables_ocr_backends.tf
# et `terraform apply`.

steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-f'
      - 'workers/ocr-vlm-groq/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/prt-prod-docker/worker-ocr-vlm-groq:${_SHORT_SHA}'
      - '.'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/prt-prod-docker/worker-ocr-vlm-groq:${_SHORT_SHA}'

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/prt-prod-docker/worker-ocr-vlm-groq:${_SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SHORT_SHA: 'latest'
