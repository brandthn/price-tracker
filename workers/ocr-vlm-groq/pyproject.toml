[project]
name = "pricetracker-ocr-vlm-groq"
version = "0.1.0"
description = "PriceTracker worker OCR — backend VLM Groq (Llama 4 Scout), Pub/Sub push, Cloud SQL."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PriceTracker" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "google-cloud-storage>=2.16",
    "google-auth>=2.36.0",
    "asyncpg>=0.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "Pillow>=10.0",
    "json-repair>=0.30",
    "groq>=0.13",
    "pricetracker-receipt-pipeline",
    "pricetracker-matching",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricetracker_ocr_vlm_groq"]

[tool.uv]
package = true

[tool.uv.sources]
pricetracker-receipt-pipeline = { path = "../../libs/pricetracker_receipt_pipeline" }
pricetracker-matching = { path = "../../libs/pricetracker_matching" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
